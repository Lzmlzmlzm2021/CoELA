name: PeerConsult protocol contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install offline adapter dependency
        run: python -m pip install numpy==1.26.4
      - name: Verify shared package
        run: python -B peerconsult_core/check_manifest.py
      - name: Run shared contracts
        run: python -B -m unittest discover -s peerconsult_core/tests -v
      - name: Run TDW transaction adapter tests without Unity
        run: python -B -m unittest discover -s tdw_mat/tests -p test_peer_consult_common.py -v
